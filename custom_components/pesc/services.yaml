update_value:
  name: Update Energy Value
  description: Send meter readings, one request per meter.
  fields:
    values:
      name: Values
      description: Readings per sensor, one request per meter
      required: true
      selector:
        object:
          multiple: true
          label_field: entity_id
          description_field: value
          translation_key: values
          fields:
            entity_id:
              required: true
              selector:
                entity:
                  filter:
                    integration: pesc
                    domain: sensor
                    supported_features:
                      - climate.ClimateEntityFeature.TARGET_TEMPERATURE
            value:
              required: true
              selector:
                number:
                  min: 1
                  max: 999999
                  mode: box
    throws:
      name: Throws
      description: Raise an error if the readings were not accepted
      default: true
      selector:
        boolean:
